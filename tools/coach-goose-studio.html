<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14221a">
  <link rel="icon" href="data:,">
  <title>教練鵝動作試玩室</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(16,26,20,.88); --line: rgba(235,245,230,.16); --text:#f4f5ee; --muted:#c2ccbd; --accent:#9bd27e; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#17211a; color:var(--text); font:15px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    #view { position:fixed; inset:0; touch-action:none; }
    #view canvas { width:100%; height:100%; display:block; }
    .top { position:fixed; z-index:2; top:max(12px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; pointer-events:none; }
    .brand,.status { padding:10px 14px; border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(12px); box-shadow:0 8px 24px #0003; }
    .brand strong { display:block; font-size:16px; letter-spacing:.02em; }
    .brand small,.status small { color:var(--muted); }
    .status { text-align:right; max-width:54%; }
    .controls { position:fixed; z-index:2; left:12px; right:12px; bottom:max(12px,env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; padding:10px; border:1px solid var(--line); border-radius:20px; background:var(--panel); backdrop-filter:blur(14px); box-shadow:0 8px 28px #0004; }
    button { min-height:44px; border:1px solid var(--line); border-radius:13px; padding:9px 8px; color:var(--text); background:#28372c; font:600 14px/1.2 inherit; cursor:pointer; }
    button:active { transform:scale(.98); }
    button.primary { background:#426c3d; border-color:#7dae67; }
    button.on { background:#385b39; border-color:var(--accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .options { position:fixed; z-index:2; top:78px; right:12px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .pill { display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid var(--line); border-radius:999px; background:var(--panel); backdrop-filter:blur(10px); font-size:13px; }
    .pill input { accent-color:var(--accent); }
    .camera-picker { position:fixed; right:12px; bottom:max(140px,calc(env(safe-area-inset-bottom) + 140px)); max-width:230px; border-radius:14px; flex-wrap:wrap; }
    .camera-picker select { width:100%; min-height:36px; color:var(--text); background:#28372c; border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
    .camera-picker button { min-height:30px; padding:5px 8px; font-size:12px; }
    #camPreview { position:fixed; z-index:2; top:78px; left:12px; width:min(25vw,112px); aspect-ratio:3/4; object-fit:cover; transform:scaleX(-1); border:1px solid var(--line); border-radius:14px; background:#0b0d0b; opacity:.88; display:none; }
    #camPreview.show { display:block; }
    #download { position:fixed; z-index:3; left:50%; bottom:max(82px,calc(env(safe-area-inset-bottom) + 82px)); transform:translateX(-50%); display:none; border-radius:999px; padding:10px 16px; background:#f5f1d8; color:#1d281f; text-decoration:none; font-weight:700; box-shadow:0 8px 24px #0004; white-space:nowrap; }
    #hint { position:fixed; z-index:2; bottom:max(86px,calc(env(safe-area-inset-bottom) + 86px)); left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 28px); padding:8px 12px; border-radius:12px; background:#101a14b8; color:#e7ede2; text-align:center; font-size:12px; pointer-events:none; }
    @media (min-width:700px) {
      .controls { left:50%; right:auto; width:min(680px,calc(100vw - 24px)); transform:translateX(-50%); }
      .options { top:90px; right:18px; }
      #camPreview { top:90px; left:18px; width:160px; }
      #hint { bottom:82px; }
      #download { bottom:78px; }
    }
    @media (max-width:390px) { .controls { gap:6px; padding:8px; } button { font-size:12px; padding-inline:4px; } .brand { padding:9px 11px; } }
  </style>
  <!-- 外部 3D 渲染與體感套件 (SRI 完整性保護) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"
    integrity="sha384-fljlqkjWlmSFjkESkQvm77heIZpoWmXEOzlCA7kOpGUH+95Zk0yGfQieWM2q136E"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
    integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"
    integrity="sha384-qcJQ+n/ZcF15Xu2EoRupB4Av+GEAGeW0Td1mp2A90u0NdNLzLYQVMUq1Ax1YAHqk"
    crossorigin="anonymous"></script>
</head>
<body>
  <main id="view" aria-label="教練鵝 3D 預覽"></main>
  <header class="top">
    <div class="brand"><strong>🪿 教練鵝動作試玩室</strong><small>試動畫、鏡頭操控與綠幕錄影</small></div>
    <div class="status"><strong id="state">正在載入模型…</strong><br><small id="detail">首次載入約 4 MB</small></div>
  </header>
  <video id="camPreview" playsinline muted></video>
  <div class="options">
    <div class="pill camera-picker">
      <label for="cameraSelect">使用哪一台相機</label>
      <button id="refreshCameras" type="button">更新清單</button>
      <select id="cameraSelect"><option value="">請選擇相機</option></select>
    </div>
    <label class="pill"><input id="greenToggle" type="checkbox"> 綠幕背景</label>
    <label class="pill"><input id="mirrorToggle" type="checkbox" checked> 自拍鏡像</label>
  </div>
  <div id="hint">拖曳旋轉、雙指縮放；綠幕錄影只會錄下 3D 畫布</div>
  <a id="download" download="coach-goose-greenscreen.webm">下載錄影</a>
  <nav class="controls" aria-label="動作控制">
    <button id="resetView">重置視角</button>
    <button id="waveButton" class="primary" disabled>播放揮手</button>
    <button id="cameraButton">開啟鏡頭</button>
    <button id="recordButton">開始錄影</button>
  </nav>

  <script>
  (() => {
    const MODEL_URL = '../models/nchu_goose_coach.glb';
    const MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';
    const view = document.getElementById('view');
    const stateEl = document.getElementById('state');
    const detailEl = document.getElementById('detail');
    const video = document.getElementById('camPreview');
    const greenToggle = document.getElementById('greenToggle');
    const mirrorToggle = document.getElementById('mirrorToggle');
    const waveButton = document.getElementById('waveButton');
    const cameraButton = document.getElementById('cameraButton');
    const cameraSelect = document.getElementById('cameraSelect');
    const recordButton = document.getElementById('recordButton');
    const downloadLink = document.getElementById('download');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17211a);
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
    camera.position.set(0, 1.65, 7.2);
    camera.lookAt(0, 1.0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'low-power' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.35));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = false;
    view.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x344532, 1.45));
    const keyLight = new THREE.DirectionalLight(0xfff4db, 2.0);
    keyLight.position.set(-3, 5, 4); scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd8eaff, 0.75);
    fillLight.position.set(3, 2, -3); scene.add(fillLight);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0); controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 4.2; controls.maxDistance = 10;
    const clock = new THREE.Clock();
    let modelRoot = null, mixer = null, waveAction = null, pose = null, stream = null, recorder = null;
    let cameraOn = false, poseBusy = false, lastPoseSend = 0, recordingChunks = [];
    const bones = Object.create(null), restPose = Object.create(null), smoothed = [];
    const V3 = THREE.Vector3, Q = THREE.Quaternion;
    const tmpA = new V3(), tmpB = new V3(), tmpDir = new V3();
    const restWidth = { value: 0 }, pelvisBase = new V3();

    function setState(title, detail) { stateEl.textContent = title; detailEl.textContent = detail || ''; }
    function restoreRig() {
      for (const name in restPose) bones[name].quaternion.copy(restPose[name].localQ);
      if (modelRoot) modelRoot.updateMatrixWorld(true);
    }
    function getLm(lms, idx) {
      const p = lms && lms[idx];
      return p && (p.visibility == null || p.visibility > 0.48) ? p : null;
    }
    function midpoint(a, b) { return a && b ? { x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5, z:(a.z+b.z)*0.5 } : (a || b); }
    function onPose(results) {
      if (!cameraOn || !results.poseLandmarks || !modelRoot) return;
      const lm = results.poseLandmarks;
      const leftShoulder = getLm(lm, 11), rightShoulder = getLm(lm, 12);
      const hipCenter = midpoint(getLm(lm, 23), getLm(lm, 24));
      if (!leftShoulder || !rightShoulder || !hipCenter) return;
      const shoulderSpan = Math.max(0.08, Math.hypot(leftShoulder.x-rightShoulder.x, leftShoulder.y-rightShoulder.y));
      const scale = restWidth.value / shoulderSpan;
      const mirror = mirrorToggle.checked ? -1 : 1;
      const mapPoint = (idx) => {
        const p = getLm(lm, idx); if (!p) return null;
        return new V3(
          (p.x-hipCenter.x) * scale * mirror,
          pelvisBase.y + (hipCenter.y-p.y) * scale,
          pelvisBase.z - (p.z-hipCenter.z) * scale * 0.7
        );
      };
      // 輕量 EMA，讓肩、肘和膝蓋不因單幀抖動而突然跳動。
      const read = (idx) => {
        const raw = mapPoint(idx); if (!raw) return null;
        if (!smoothed[idx]) smoothed[idx] = raw.clone();
        else smoothed[idx].lerp(raw, 0.42);
        return smoothed[idx];
      };
      const centers = (a,b) => { const pa=read(a), pb=read(b); return pa&&pb ? tmpA.copy(pa).add(pb).multiplyScalar(0.5).clone() : (pa||pb); };
      const apply = (boneName, start, end) => {
        const bone = bones[boneName], ref = restPose[boneName];
        const from = Array.isArray(start) ? centers(start[0],start[1]) : read(start);
        const to = Array.isArray(end) ? centers(end[0],end[1]) : read(end);
        if (!bone || !ref || !from || !to) return;
        tmpDir.subVectors(to, from);
        if (tmpDir.lengthSq() < 1e-5) return;
        tmpDir.normalize();
        const delta = new Q().setFromUnitVectors(ref.dirWorld, tmpDir);
        const desiredWorld = delta.multiply(ref.worldQ);
        modelRoot.updateMatrixWorld(true);
        const parentQ = bone.parent.getWorldQuaternion(new Q()).invert();
        bone.quaternion.copy(parentQ.multiply(desiredWorld));
      };
      // 名稱對應到 MediaPipe 的人體左右；x 軸採目前自拍鏡像選項。
      apply('Spine', [23,24], [11,12]);
      apply('NeckBase', [11,12], [7,8]);
      apply('NeckMid', [7,8], 0);
      apply('Shoulder_L', 11, 13); apply('Elbow_L', 13, 15);
      apply('Shoulder_R', 12, 14); apply('Elbow_R', 14, 16);
      apply('Hip_L', 23, 25); apply('Knee_L', 25, 27);
      apply('Hip_R', 24, 26); apply('Knee_R', 26, 28);
      // 只讓模型隨人小幅左右移動，避免站位偏移把角色帶出畫面。
      modelRoot.position.x = THREE.MathUtils.clamp((hipCenter.x-0.5)*scale*mirror*0.28, -0.42, 0.42);
      modelRoot.position.y = THREE.MathUtils.clamp((0.52-hipCenter.y)*scale*0.12, -0.2, 0.2);
    }

    function fitModelToView() {
      if (!modelRoot) return;
      modelRoot.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(modelRoot);
      const size = bounds.getSize(new V3());
      const center = bounds.getCenter(new V3());
      const vHalf = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
      const distance = Math.max(size.y / (2 * Math.tan(vHalf)), size.x / (2 * Math.tan(hHalf))) * 1.22;
      // 手機介面頂部有標題，將主角中心略往畫面下方安排，讓帽子不被標題卡蓋住。
      const aim = center.clone(); aim.y += size.y * 0.38;
      controls.target.copy(aim);
      camera.position.set(aim.x, aim.y + size.y * 0.05, center.z + distance);
      camera.lookAt(aim);
      controls.update();
    }
    function onResize() {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.35)); renderer.setSize(innerWidth, innerHeight);
      if (modelRoot) fitModelToView();
    }
    addEventListener('resize', onResize);
    greenToggle.addEventListener('change', () => {
      scene.background.set(greenToggle.checked ? 0x00b140 : 0x17211a);
      document.getElementById('hint').textContent = greenToggle.checked
        ? '純綠畫布已開啟；錄影只包含角色和背景，後製可用色度去背'
        : '拖曳旋轉、雙指縮放；綠幕錄影只會錄下 3D 畫布';
    });
    document.getElementById('resetView').addEventListener('click', () => {
      fitModelToView();
      if (modelRoot) { modelRoot.position.set(0,0,0); modelRoot.rotation.set(0,0,0); }
    });
    waveButton.addEventListener('click', () => {
      if (!waveAction) return;
      if (cameraOn) stopCamera();
      waveAction.reset(); waveAction.setLoop(THREE.LoopRepeat); waveAction.play();
      setState('播放揮手動畫', '此 GLB 目前包含一段揮手動作');
    });
    cameraButton.addEventListener('click', async () => cameraOn ? stopCamera() : startCamera());

    function preferredCamera(devices) {
      return devices.find(d => /FaceTime|built.?in|integrated|MacBook|內建/i.test(d.label) && !/iPhone|iPad|Continuity|接續互通/i.test(d.label));
    }
    async function refreshCameras() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
        const previous = cameraSelect.value;
        cameraSelect.replaceChildren(new Option('請選擇相機', ''), new Option('系統預設相機（可能是 iPhone）', 'default'));
        devices.forEach((device, index) => {
          if (device.deviceId) cameraSelect.add(new Option(device.label || `尚未授權名稱的相機 ${index + 1}`, device.deviceId));
        });
        const preferred = preferredCamera(devices);
        if ([...cameraSelect.options].some(o => o.value === previous) && previous) cameraSelect.value = previous;
        else if (preferred) cameraSelect.value = preferred.deviceId;
      } catch (err) { setState('無法取得相機清單', err.message); }
    }
    document.getElementById('refreshCameras').addEventListener('click', refreshCameras);
    cameraSelect.addEventListener('change', () => {
      if (cameraOn) stopCamera();
      if (cameraSelect.value) setState('相機已選擇', cameraSelect.selectedOptions[0].textContent + '；按「開啟鏡頭」開始');
    });
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', refreshCameras);
    refreshCameras();

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.Pose) {
        setState('鏡頭功能不可用', '請用 localhost 或 HTTPS，並確認瀏覽器支援相機'); return;
      }
      if (!cameraSelect.value) {
        setState('請先選擇相機', '在右上清單選 FaceTime HD Camera 或 Mac 內建相機，再按開啟'); return;
      }
      cameraButton.disabled = true;
      try {
        const videoOptions = { width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:24,max:30} };
        if (cameraSelect.value === 'default') videoOptions.facingMode = 'user';
        else videoOptions.deviceId = { exact:cameraSelect.value };
        stream = await navigator.mediaDevices.getUserMedia({ video:videoOptions, audio:false });
        const cameraTrack = stream.getVideoTracks()[0];
        await refreshCameras();
        const actualDeviceId = cameraTrack.getSettings().deviceId;
        if ([...cameraSelect.options].some(o => o.value === actualDeviceId)) cameraSelect.value = actualDeviceId;
        video.srcObject = stream; await video.play(); video.classList.add('show');
        pose = new Pose({ locateFile: (file) => MP_CDN + file });
        pose.setOptions({ modelComplexity:0, smoothLandmarks:true, enableSegmentation:false, minDetectionConfidence:0.55, minTrackingConfidence:0.5 });
        pose.onResults(onPose);
        cameraOn = true; cameraButton.textContent = '關閉鏡頭'; cameraButton.classList.add('on');
        if (waveAction) { waveAction.stop(); mixer.stopAllAction(); }
        restoreRig(); smoothed.length = 0;
        setState('鏡頭操控中', (cameraTrack.label || '已選相機') + '；請保持全身入鏡');
      } catch (err) {
        stopCamera(); setState('無法開啟鏡頭', err && err.message ? err.message : '請檢查相機權限');
      } finally { cameraButton.disabled = false; }
    }
    function stopCamera() {
      cameraOn = false; poseBusy = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (pose) { pose.close(); pose = null; }
      video.srcObject = null; video.classList.remove('show');
      cameraButton.textContent = '開啟鏡頭'; cameraButton.classList.remove('on');
      if (modelRoot) { modelRoot.position.x = 0; modelRoot.position.y = 0; restoreRig(); }
      if (modelRoot) setState('模型已載入', '可播放揮手動畫或開啟鏡頭操控');
    }
    addEventListener('pagehide', stopCamera);
    recordButton.addEventListener('click', () => {
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      if (!renderer.domElement.captureStream || !window.MediaRecorder) {
        setState('此瀏覽器不支援錄影', '可以直接用系統螢幕錄影'); return;
      }
      const streamOut = renderer.domElement.captureStream(30);
      const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
      try { recorder = new MediaRecorder(streamOut, mime ? {mimeType:mime} : undefined); }
      catch (err) { setState('錄影啟動失敗', err.message); return; }
      recordingChunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size) recordingChunks.push(e.data); };
      recorder.onstop = () => {
        const type = recorder.mimeType || 'video/webm';
        const blob = new Blob(recordingChunks, {type});
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = type.includes('mp4') ? 'coach-goose-greenscreen.mp4' : 'coach-goose-greenscreen.webm';
        downloadLink.style.display = 'block';
        recordButton.textContent = '開始錄影'; recordButton.classList.remove('on');
        streamOut.getTracks().forEach(t => t.stop());
        setState('錄影完成', `影片約 ${(blob.size/1024/1024).toFixed(1)} MB，點畫面中央下載`);
      };
      downloadLink.style.display = 'none'; recorder.start(250);
      recordButton.textContent = '停止錄影'; recordButton.classList.add('on');
      setState('正在錄影', greenToggle.checked ? '綠幕背景會寫進影片' : '目前錄製一般背景');
    });

    const loader = new THREE.GLTFLoader();
    loader.load(MODEL_URL, (gltf) => {
      modelRoot = gltf.scene;
      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = box.getSize(new V3());
      const scale = 1.72 / Math.max(size.y, 0.001);
      modelRoot.scale.setScalar(scale);
      modelRoot.position.set(-((box.min.x+box.max.x)*0.5)*scale, -box.min.y*scale, 0);
      scene.add(modelRoot); modelRoot.updateMatrixWorld(true);
      const names = ['Pelvis','Spine','NeckBase','NeckMid','Head','Shoulder_L','Elbow_L','Hand_L','Shoulder_R','Elbow_R','Hand_R','Hip_L','Knee_L','Ankle_L','Hip_R','Knee_R','Ankle_R'];
      names.forEach(name => {
        const bone = modelRoot.getObjectByName(name);
        if (!bone || !bone.isBone) return;
        bones[name] = bone;
        const worldQ = bone.getWorldQuaternion(new Q());
        const worldP = bone.getWorldPosition(new V3());
        let child = bone.children.find(o => o.isBone);
        if (!child && name.startsWith('Shoulder_')) child = modelRoot.getObjectByName(name.replace('Shoulder_','Elbow_'));
        if (!child && name.startsWith('Elbow_')) child = modelRoot.getObjectByName(name.replace('Elbow_','Hand_'));
        const dir = child ? child.getWorldPosition(new V3()).sub(worldP).normalize() : new V3(0,1,0);
        restPose[name] = { localQ:bone.quaternion.clone(), worldQ, dirWorld:dir };
      });
      const l = bones.Shoulder_L && bones.Shoulder_L.getWorldPosition(new V3());
      const r = bones.Shoulder_R && bones.Shoulder_R.getWorldPosition(new V3());
      if (l && r) restWidth.value = l.distanceTo(r);
      if (bones.Pelvis) bones.Pelvis.getWorldPosition(pelvisBase);
      mixer = new THREE.AnimationMixer(modelRoot);
      if (gltf.animations && gltf.animations.length) waveAction = mixer.clipAction(gltf.animations[0]);
      waveButton.disabled = !waveAction;
      fitModelToView();
      setState('模型已載入', waveAction ? '可播放揮手、開啟鏡頭或錄綠幕影片' : '可開啟鏡頭操控');
      // 預覽先保持靜止；要看揮手再按按鈕。
    }, undefined, (err) => {
      console.error(err); setState('模型載入失敗', '請確認專案 models/nchu_goose_coach.glb 存在');
    });

    async function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(),0.05);
      controls.update();
      if (mixer && !cameraOn) mixer.update(dt);
      if (cameraOn && pose && video.readyState >= 2 && !poseBusy && now-lastPoseSend > 66) {
        poseBusy = true; lastPoseSend = now;
        try { await pose.send({image:video}); } catch (err) { console.warn('Pose frame skipped',err); }
        poseBusy = false;
      }
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
  })();
  </script>
</body>
